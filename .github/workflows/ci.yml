name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # A real PostgreSQL for the migration and checkpointer tests (the rest use SQLite).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orm_ai
          POSTGRES_PASSWORD: orm_ai
          POSTGRES_DB: orm_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orm_ai -d orm_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://orm_ai:orm_ai@localhost:5432/orm_ai_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m scripts.draw_graph --check

  frontend:
    name: Frontend (lint + types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  production-stack:
    name: Production stack (Docker images + smoke test)
    runs-on: ubuntu-latest
    # Throwaway values: the stack only lives for this job.
    env:
      AUTH_SECRET: ci-smoke-test-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      POSTGRES_PASSWORD: ci-smoke-test-password
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - name: Build both images and start the stack
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          set -eu
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:3000/ | grep -q "ORM_AI"
          # Production rules hold: no development logins, records need a login.
          test "$(code -X POST http://localhost:8000/api/auth/dev-token \
            -H 'Content-Type: application/json' -d '{"user_id":"USR-001"}')" = 403
          test "$(code http://localhost:8000/api/workflows)" = 401
          # The evaluation set ships with the image.
          docker compose -f docker-compose.prod.yml exec -T backend \
            test -f evaluation/datasets/agent_cases.yaml
      - name: Logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 200
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
