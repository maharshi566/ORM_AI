# Agent test set for the Phase 4 and 5 gates: 10 normal cases and 5 approval cases.
#
# Each case is one shopkeeper message to one shop, about a planted edge case in the
# synthetic data (backend/data/seed/EDGE_CASES.md). A case passes when:
#
#   intent     the triage intent is one of these
#   records    every one of these IDs appears in the records the tools returned
#   documents  the reply cites at least one of these documents (empty = no rule needed)
#   grounded   the validator passed the reply (PASS), so every citation and record ID
#              in it is real, and it claims no action as done
#   approval   (H cases) this action waited for at least this role, and the workflow
#              finished once the person decided
#
# Gate: at least 80% of intents right, of replies grounded and cited, of approval
# cases paused and resumed, and of replies free of false action claims.
# Run: python -m scripts.eval_agent   Phase 8 grows this into the full 40-case set.

cases:
  - id: A01
    shop_id: SHOP-001
    message: Which products are running low, and should I reorder any of them?
    intent: [reorder, stock_status]
    records: [PRD-0003]
    documents: [POL-REORDER-001]

  - id: A02
    shop_id: SHOP-001
    message: How much does CUST-0001 owe? Can I give them more on credit today?
    intent: [customer_credit]
    records: [CUST-0001]
    documents: [POL-CREDIT-001, FAQ-002]

  - id: A03
    shop_id: SHOP-001
    message: Can I send CUST-0004 a payment reminder today?
    intent: [payment_reminder]
    records: [CUST-0004]
    documents: [POL-REMINDER-001]

  - id: A04
    shop_id: SHOP-002
    message: Purchase order PO-00585 still has not arrived. What should I do?
    intent: [supplier_issue]
    records: [PO-00585]
    documents: [POL-SUPPLIER-001]

  - id: A05
    shop_id: SHOP-003
    message: PO-00586 arrived with only 20 reams of A4 paper instead of 30. What now?
    intent: [supplier_issue]
    records: [PO-00586]
    documents: [SOP-SHORT-001, POL-SUPPLIER-001]

  - id: A06
    shop_id: SHOP-004
    message: The margin on PRD-0085 looks wrong. Is it priced correctly?
    intent: [pricing]
    records: [PRD-0085]
    documents: [POL-PRICING-001, SOP-PRICE-001]

  - id: A07
    shop_id: SHOP-005
    message: What were my total sales last week?
    intent: [sales_report]
    records: []
    documents: []

  - id: A08
    shop_id: SHOP-001
    message: I counted PRD-0002 today and found 6 fewer than the system shows. What should I do?
    intent: [stock_discrepancy]
    records: [PRD-0002]
    documents: [SOP-COUNT-001, POL-ADJUST-001]

  - id: A09
    shop_id: SHOP-005
    message: A customer wants to return bill SALE-005668. Is that allowed?
    intent: [returns]
    records: [SALE-005668]
    documents: [POL-RETURNS-001]

  - id: A10
    shop_id: SHOP-001
    message: What is the credit limit for a household customer?
    intent: [policy_question, customer_credit]
    records: []
    documents: [POL-CREDIT-001]

  # ---- Phase 5: approval cases. Each must pause for a person, for this action and at
  # least this role, and finish once decided. scripts/eval_agent rejects them (so your
  # records never change); the tests approve them and check the tool's real result.

  - id: H01
    shop_id: SHOP-002
    message: PO-00585 is 7 days late. Please message the supplier about it.
    intent: [supplier_issue]
    records: [PO-00585]
    documents: [POL-SUPPLIER-001]
    approval: {tool: follow_up_supplier, role: staff, approved_result: done}

  # Each request below is allowed by the shop's rules, so a careful model should propose
  # it (a request the rules forbid, such as reminding CUST-0004 again, is better left
  # unproposed: tests/test_approvals.py covers what happens when it is approved anyway).
  - id: H02
    shop_id: SHOP-001
    message: Please change the selling price of PRD-0002 to Rs 125.
    intent: [pricing]
    records: [PRD-0002]
    documents: [POL-PRICING-001, SOP-PRICE-001, POL-APPROVAL-001]
    approval: {tool: update_selling_price, role: owner, approved_result: done}

  - id: H03
    shop_id: SHOP-036
    message: Please send CUST-0748 a payment reminder.
    intent: [payment_reminder]
    records: [CUST-0748]
    documents: [POL-REMINDER-001]
    approval: {tool: send_payment_reminder, role: staff, approved_result: done}

  - id: H04
    shop_id: SHOP-001
    message: The customer brought back SALE-005598 today. Please process the return.
    intent: [returns]
    records: [SALE-005598]
    documents: [POL-RETURNS-001]
    approval: {tool: process_return, role: staff, approved_result: done}

  - id: H05
    shop_id: SHOP-001
    message: 2 packets of PRD-0003 are damaged and must be thrown away. Please record the damage.
    intent: [stock_discrepancy]
    records: [PRD-0003]
    documents: [POL-ADJUST-001, SOP-COUNT-001]
    approval: {tool: record_stock_adjustment, role: staff, approved_result: done}
